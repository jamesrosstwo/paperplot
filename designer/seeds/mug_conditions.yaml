# Seed spec (copied once into a designer state dir; never edited by a running designer).
# Example data: made-up counts. [k, n, {dup: true}] = a cell with re-run positions: its interval is drawn in
# style.dup_ci_color (yellow). null = not evaluated (n/a).
# Columns sorted by success rate, Nominal kept first in gray. ci is none; set ci: wilson to see the yellow
# re-run intervals on Nominal and Light (hard).
id: mug_conditions
kind: grouped_bars
title: 'Mug: base pi0.5 on Nominal and each single perturbation'
output: figures/evals/mug_conditions.pdf
data:
  source: inline
  levels: [Nominal, BG, Light (easy), Cloth, Distractor, View (easy), View (hard), Light (hard)]
  arms:
  - name: $\mathrm{\pi}_{0.5}$
    color: tol-blue
    counts: [[16, 20, {dup: true}], [17, 20], [18, 20], [15, 20], [11, 20], [14, 20], [7, 20], [12, 20, {dup: true}]]
style:
  theme: acme
  font_family: null
  width_pt: 180
  height_pt: 108
  panel_gap: 6
  share_x_labels: false
  panel_title_loc: upper right
  panel_title_fontsize: null
  panel_ylabel: each
  group_width: 0.5
  bar_fill: 0.9
  edge_width: null
  na_label: n/a
  arm_order: null
  level_sort: desc
  level_pin_first: 1
  legend_loc: above
  legend_align: right
  legend_cols: 5
  legend_fontsize: 8
  legend_box_fontsize: 6
  legend_pad: 0.2
  tick_fontsize: 6
  xtick_fontsize: 6
  xtick_rotation: 45
  ylabel: Success Rate
  ylabel_fontsize: 10
  y_mode: count
  out_of: 20
  ytick_step: 20
  divider_before: 1
  divider_style: theme
  ci: none
  ci_level: 0.95
  ci_color: '#222222'
  ci_linewidth: 0.6
  ci_capsize: 1.5
  partial_below: 20
  partial_ci_color: '#CC3311'
  dup_ci_color: '#DDAA33'
  palette: null
  level_colors:
    Nominal: tol-grey
  fill_darken: 0.7
  edge_darken: 0.6
  transparent: false
