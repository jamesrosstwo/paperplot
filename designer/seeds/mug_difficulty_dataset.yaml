# Seed spec backed by the data store: the mug rows of a table registered as "difficulty_eval" (columns task,
# condition, policy, successes, trials). A policy with no row at a level is drawn as n/a.
id: mug_difficulty_dataset
kind: grouped_bars
title: Mug successes by difficulty, from data/difficulty_eval.tsv
output: figures/evals/mug_difficulty_dataset.pdf
data:
  source: dataset
  dataset: difficulty_eval
  query:
    level: condition
    arm: policy
    successes: successes
    trials: trials
    filter: {task: mug}
    levels: [Nominal, Easy, Medium]
    arms:
    - key: base
      name: $\mathrm{\pi}_{0.5}$ (base policy)
      color: tol-blue
    - {key: classical, name: Classical, color: tol-yellow}
    - {key: zeronvs, name: ZeroNVS, color: tol-purple}
    - {key: roboengine, name: RoboEngine, color: tol-green}
    - {key: ours, name: Ours, color: tol-red}
style:
  theme: acme
  font_family: null
  width_pt: 252
  height_pt: 80
  group_width: 0.66
  bar_fill: 0.583
  edge_width: null
  na_label: n/a
  legend_loc: above
  legend_cols: 5
  legend_fontsize: 6
  tick_fontsize: null
  xtick_fontsize: 7
  ylabel: Successes
  ylabel_fontsize: null
  y_mode: count
  out_of: 20
  ytick_step: 25
  divider_before: null
  ci: wilson
  ci_level: 0.95
  ci_color: '#222222'
  ci_linewidth: 0.6
  ci_capsize: 1.5
  partial_below: 20
  partial_ci_color: '#CC3311'
  palette: null
  fill_darken: 0.7
  edge_darken: 0.6
  transparent: false
