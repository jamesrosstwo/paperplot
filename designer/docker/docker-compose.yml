# Plot designer as a service (designer/CONTRACT.md section 8). See README.md in this folder.
#
#   cd paperplot/designer/docker
#   export PAPER_DIR=/home/james/paper  STATE_DIR=/home/james/designer_state  DATA_DIR=/data/evals
#   export DESIGNER_TOKEN=$(openssl rand -hex 24)
#   ./build.sh                           # build with ONE tool: build.sh (no --build here; mixing the two leaves
#                                        # a dangling copy of the image each time, labels differ)
#   docker compose up -d
#   open http://127.0.0.1:8766/login and paste the token (sets an HttpOnly cookie)
#
# Variables (a .env file next to this compose file works too):
#   PAPER_DIR        host path of the paper git repo            -> /paper (read-write)      [required]
#   STATE_DIR        host dir for specs / data registry / cache -> /state (read-write)      [required]
#   DATA_DIR         host data dir, mounted READ-ONLY at the SAME absolute path, so dataset paths registered in the
#                    designer resolve identically inside and outside the container. Have none? point it at an
#                    empty dir. It is also DESIGNER_DATA_ROOTS: datasets can only be registered from inside it.
#                    More data dirs: copy the line under `volumes:` and add the path to DESIGNER_DATA_ROOTS
#                    below (':'-separated).                                                    [required]
#   DESIGNER_TOKEN   access token; the container binds 0.0.0.0, so the server refuses to start without it
#   DESIGNER_PUBLISH_PORT  host port (default 8766), published on 127.0.0.1 only
#   DESIGNER_IMAGE   image tag to run/build (default paperplot-designer:latest)
#   DESIGNER_CONTAINER_NAME  container name (default paperplot-designer)
#   DESIGNER_UID / DESIGNER_GID  build args: your uid/gid (`id -u` / `id -g`) so files written into PAPER_DIR keep
#                    your ownership (default 1000)
#   DESIGNER_GIT_NAME / DESIGNER_GIT_EMAIL  author of commits made from the designer
#   DESIGNER_READONLY=1  serve without any writes to the paper / registry / git
#   DESIGNER_BASE_PATH   URL prefix when behind a reverse proxy subpath (e.g. /designer)

name: paperplot-designer

services:
  designer:
    image: ${DESIGNER_IMAGE:-paperplot-designer:latest}
    container_name: ${DESIGNER_CONTAINER_NAME:-paperplot-designer}
    build:
      context: ../..                         # the paperplot folder (designer/ + the paperplot library)
      dockerfile: designer/docker/Dockerfile
      args:
        UID: ${DESIGNER_UID:-1000}
        GID: ${DESIGNER_GID:-1000}
    init: true
    restart: unless-stopped
    ports:
      # Loopback only by default. To reach it over the tailnet, publish on the machine's tailscale IP instead
      # (never without DESIGNER_TOKEN), e.g.  DESIGNER_BIND=100.x.y.z  and
      #   - "${DESIGNER_BIND}:${DESIGNER_PUBLISH_PORT:-8766}:8766"
      # or keep loopback and use `tailscale serve --bg --https=443 http://127.0.0.1:8766`.
      - "127.0.0.1:${DESIGNER_PUBLISH_PORT:-8766}:8766"
    environment:
      DESIGNER_TOKEN: ${DESIGNER_TOKEN:?set DESIGNER_TOKEN (e.g. export DESIGNER_TOKEN=$(openssl rand -hex 24))}
      DESIGNER_GIT_NAME: ${DESIGNER_GIT_NAME:-}
      DESIGNER_GIT_EMAIL: ${DESIGNER_GIT_EMAIL:-}
      DESIGNER_READONLY: ${DESIGNER_READONLY:-}
      DESIGNER_BASE_PATH: ${DESIGNER_BASE_PATH:-}
      DESIGNER_DATA_ROOTS: ${DATA_DIR}
    volumes:
      - ${PAPER_DIR:?set PAPER_DIR to the paper git repo}:/paper
      - ${STATE_DIR:?set STATE_DIR to a host dir for designer state}:/state
      - ${DATA_DIR:?set DATA_DIR (mounted read-only at the same path; an empty dir is fine)}:${DATA_DIR}:ro
      # Git credentials for Push, read-only and optional (uncomment one):
      #   HTTPS (Overleaf: https + token in ~/.git-credentials):
      # - ${HOME}/.git-credentials:/run/designer/git-credentials:ro
      #   SSH remotes:
      # - ${HOME}/.ssh:/home/designer/.ssh:ro
